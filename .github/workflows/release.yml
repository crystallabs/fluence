name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container: crystallang/crystal:1.21.0-alpine
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: shards install --production

      - name: Build static binary
        run: |
          mkdir -p bin
          crystal build --release --static -o bin/fluence src/fluence.cr

      - name: Package
        id: package
        run: |
          version="${{ github.event.release.tag_name }}"
          version="${version:-v$(sed -n 's/^version: *//p' shard.yml)}"
          name="fluence-${version}-linux-${{ matrix.arch }}"
          mkdir "$name"
          cp bin/fluence README.md LICENSE "$name/"
          cp -r public "$name/public"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            ${{ steps.package.outputs.name }}.tar.gz
            ${{ steps.package.outputs.name }}.tar.gz.sha256
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.package.outputs.name }}.tar.gz
            ${{ steps.package.outputs.name }}.tar.gz.sha256
