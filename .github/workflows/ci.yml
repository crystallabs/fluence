name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.21.0 is the version the Dockerfile and the release workflow
        # build with; latest and nightly catch upcoming breakage.
        crystal: ["1.21.0", latest, nightly]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # install-crystal installs packages without refreshing the package
      # index, which fails when the runner image's index has gone stale.
      - name: Update package index
        run: sudo apt-get update -y

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ matrix.crystal }}

      - name: Install dependencies
        run: shards install

      - name: Check formatting
        run: crystal tool format --check src spec config

      - name: Run specs
        run: crystal spec

      - name: Build
        run: crystal build src/fluence.cr --no-codegen

      - name: Lint
        run: make lint
