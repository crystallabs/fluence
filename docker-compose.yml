services:
  web:
    build: .
    image: fluence
    ports:
      - '3000:3000'
    # Set WIKI_SECRET to keep sessions valid across restarts.
    #environment:
    #  WIKI_SECRET: change-me
    volumes:
      - fluence-data:/app/data
      - fluence-meta:/app/meta

volumes:
  fluence-data:
  fluence-meta:
