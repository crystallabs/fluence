# Remaining exclusions are deliberate: UselessAssign (controller locals are read by slang templates), WhitespaceAroundMacroExpression (macro style),
# AccessorMethodName/BinaryOperatorParameterName/QueryBoolMethods (names are the intended API), PercentLiteralDelimiters (spec_helper.cr, owned elsewhere).

Version: "1.7.0"

Lint/UselessAssign:
  Excluded:
  - src/controllers/admin_controller.cr
  - src/controllers/helpers/page.cr
  - src/controllers/pages_controller.cr
  - src/controllers/users_controller.cr

Lint/WhitespaceAroundMacroExpression:
  Excluded:
  - config/routes.cr
  - src/acl/path.cr
  - src/controllers/application_controller/render.cr
  - src/controllers/helpers/user.cr

Naming/AccessorMethodName:
  Excluded:
  - src/controllers/helpers/user.cr

Naming/BinaryOperatorParameterName:
  Excluded:
  - src/acl/path.cr

Naming/QueryBoolMethods:
  Excluded:
  - config/options.cr

Style/PercentLiteralDelimiters:
  Excluded:
  - spec/spec_helper.cr
